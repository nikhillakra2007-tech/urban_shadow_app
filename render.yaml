# Render blueprint for UUS Delhi (Urban Shadow).
# Two services: FastAPI backend + Next.js frontend.
#
# After the first `render blueprint launch`, set these in the dashboard:
#   - backend  -> ALLOWED_ORIGINS = https://<frontend-service>.onrender.com
#   - frontend -> NEXT_PUBLIC_API_URL = https://<backend-service>.onrender.com
#     (NEXT_PUBLIC_* is inlined at BUILD time, so set it before/with redeploy.)

services:
  - type: web
    name: uus-delhi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.6"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: "10000"

  - type: web
    name: uus-delhi-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false
